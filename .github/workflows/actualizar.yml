name: Actualizar listas M3U

on:
  schedule:
    - cron: "7,37 9-21 * * *"
      # GitHub Actions usa UTC; `timezone` no forma parte de la configuración estándar.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-listas-m3u-${{ github.ref }}
  cancel-in-progress: false

jobs:
  descarga_reemplazo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Descargar las dos listas
        shell: bash
        run: |
          set -euo pipefail

          URL_PRIMERA="http://neweraes.atwebpages.com/lista_iptv.m3u"
          ARCHIVO_PRIMERA="lista_primera.m3u"
          ARCHIVO_SEGUNDA="lista_segunda.m3u"

          validar_m3u() {
            python3 -c '
          import sys
          from pathlib import Path

          ruta = Path(sys.argv[1])
          contenido = ruta.read_bytes()[:500]
          contenido = contenido.removeprefix(b"\xef\xbb\xbf")
          if not contenido.lstrip().startswith(b"#EXTM3U"):
              sys.exit(1)
          ' "$1"
          }

          descargar_y_validar() {
            local url="$1"
            local archivo="$2"

            echo "Descargando: ${url}"

            if ! curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --user-agent "Mozilla/5.0" \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 180 \
              --header "Cache-Control: no-cache" \
              --output "${archivo}" \
              "${url}"; then
              rm -f "${archivo}"
              return 1
            fi

            if [ ! -s "${archivo}" ] || ! validar_m3u "${archivo}"; then
              echo "ERROR: ${archivo} está vacío o no parece una lista M3U válida."
              rm -f "${archivo}"
              return 1
            fi

            echo "Descargada y validada: ${archivo} ($(wc -c < "${archivo}") bytes)"
          }

          # Descargar la primera lista.
          descargar_y_validar "${URL_PRIMERA}" "${ARCHIVO_PRIMERA}"

          # Probar gateways alternativos para el nombre IPNS y el archivo.
          NOMBRE_IPNS="k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs"
          RUTA_ARCHIVO="hashes.m3u"

          URLS_SEGUNDA=(
            "https://dweb.link/ipns/${NOMBRE_IPNS}/${RUTA_ARCHIVO}"
            "https://ipfs.io/ipns/${NOMBRE_IPNS}/${RUTA_ARCHIVO}"
          )

          descargada=false

          for url in "${URLS_SEGUNDA[@]}"; do
            echo "Probando gateway para la segunda lista: ${url}"

            if descargar_y_validar "${url}" "${ARCHIVO_SEGUNDA}"; then
              descargada=true
              break
            fi

            echo "No se pudo descargar una M3U válida desde este gateway."
          done

          if [ "${descargada}" != true ]; then
            echo "ERROR: No se pudo descargar la segunda lista desde los gateways probados."
            echo "Comprueba que el archivo sea público y que el nombre IPNS y la ruta sean correctos."
            exit 1
          fi

      - name: Fusionar listas por categoría y eliminar duplicados
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re

          def leer_lista(ruta):
              texto = Path(ruta).read_text(
                  encoding="utf-8-sig",
                  errors="replace",
              )

              entradas = []
              bloque = []

              for linea in texto.splitlines():
                  linea = linea.strip()

                  if not linea or linea == "#EXTM3U":
                      continue

                  if linea.startswith("#EXTINF:"):
                      if bloque:
                          entradas.append(bloque)
                      bloque = [linea]
                  elif bloque:
                      bloque.append(linea)

                      # La entrada termina al encontrar su URL.
                      # Se conservan líneas intermedias como #EXTVLCOPT.
                      if not linea.startswith("#"):
                          entradas.append(bloque)
                          bloque = []

              if bloque:
                  entradas.append(bloque)

              return entradas

          grupos = defaultdict(list)
          urls_vistas = set()
          duplicados = 0

          # La primera lista tiene prioridad si una URL aparece en ambas.
          for archivo in ("lista_primera.m3u", "lista_segunda.m3u"):
              for entrada in leer_lista(archivo):
                  url = next(
                      (linea for linea in entrada if not linea.startswith("#")),
                      None,
                  )

                  if not url:
                      continue

                  if url in urls_vistas:
                      duplicados += 1
                      continue

                  urls_vistas.add(url)

                  info = next(
                      (linea for linea in entrada if linea.startswith("#EXTINF:")),
                      "",
                  )
                  coincidencia = re.search(r'group-title="([^"]*)"', info)

                  categoria = (
                      coincidencia.group(1).strip()
                      if coincidencia and coincidencia.group(1).strip()
                      else "Sin categoría"
                  )

                  grupos[categoria].append(entrada)

          if not grupos:
              raise SystemExit("ERROR: No se encontraron entradas M3U para fusionar.")

          with open(
              "lista_original.m3u",
              "w",
              encoding="utf-8",
              newline="\n",
          ) as salida:
              salida.write("#EXTM3U\n")

              for categoria in sorted(grupos, key=str.casefold):
                  for entrada in grupos[categoria]:
                      salida.write("\n".join(entrada) + "\n")

          print(f"Categorías: {len(grupos)}")
          print(f"Canales únicos: {len(urls_vistas)}")
          print(f"Duplicados eliminados: {duplicados}")
          PY

          if [ ! -s lista_original.m3u ]; then
            echo "ERROR: La lista fusionada está vacía."
            exit 1
          fi

          echo "Lista fusionada: $(wc -c < lista_original.m3u) bytes"

      - name: Crear variantes de la lista
        shell: bash
        run: |
          set -euo pipefail

          cp lista_original.m3u lista_origen.m3u

          sed \
            's#http://127.0.0.1:6878#https://acexy.taimado.duckdns.org#g' \
            lista_original.m3u > lista_modificada.m3u

          sed \
            's#127.0.0.1:6878#192.168.1.254:6878#g' \
            lista_original.m3u > lista_local.m3u

          sed \
            's#127.0.0.1:6878#100.83.12.86:6878#g' \
            lista_original.m3u > lista_tanix.m3u

          sed \
            's#http://127.0.0.1:6878#https://acexyce.taimado.duckdns.org#g' \
            lista_original.m3u > lista_modificada_ce.m3u

          echo "Creadas las cinco variantes de la lista."

      - name: Verificar si hay cambios
        id: verify_diff
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            lista_origen.m3u \
            lista_modificada.m3u \
            lista_local.m3u \
            lista_tanix.m3u \
            lista_modificada_ce.m3u

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en las listas."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Hay cambios en las listas."
          fi

      - name: Commit y push de las listas
        if: steps.verify_diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git commit \
            -m "🤖 Lista M3U - $(TZ=Europe/Madrid date +'%Y-%m-%d %H:%M:%S')"

          git push

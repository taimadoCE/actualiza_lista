name: Actualizar listas M3U

on:
  schedule:
    - cron: '7,37 9-21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-listas-m3u-${{ github.ref }}
  cancel-in-progress: false

jobs:
  descarga_reemplazo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Playwright y Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Descargar archivo original con reintentos
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const fileUrl =
            "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u";

          const maxAttempts = 4;

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          function validarBody(body) {
            if (!body || !body.length) {
              throw new Error("El archivo descargado está vacío");
            }

            const normalizedStart = body
              .toString("utf8")
              .replace(/^\uFEFF/, "")
              .trimStart();

            if (!normalizedStart.startsWith("#EXTM3U")) {
              console.log(
                "El contenido descargado no comienza por #EXTM3U"
              );
              throw new Error("El archivo descargado no parece un M3U válido");
            }
          }

          async function descargarConReintentos() {
            let ultimoError = null;

            for (let intento = 1; intento <= maxAttempts; intento++) {
              try {
                console.log(`Intento ${intento} de ${maxAttempts}...`);

                const browser = await chromium.launch({
                  headless: true
                });

                const context = await browser.newContext();
                const page = await context.newPage();

                const response = await page.goto(fileUrl, {
                  waitUntil: "domcontentloaded",
                  timeout: 60000
                });

                if (!response || !response.ok()) {
                  throw new Error(
                    `La descarga devolvió el estado ${
                      response ? response.status() : "desconocido"
                    }`
                  );
                }

                const body = await response.body();

                validarBody(body);

                fs.writeFileSync("lista_original.m3u", body);

                await browser.close();

                console.log("Archivo descargado correctamente.");
                return;
              } catch (error) {
                ultimoError = error;
                console.error(
                  `Error en el intento ${intento}: ${error.message}`
                );

                if (intento < maxAttempts) {
                  const espera = intento * 15000;
                  console.log(`Esperando ${espera / 1000} segundos...`);
                  await sleep(espera);
                }
              }
            }

            throw new Error(
              `No se pudo descargar el archivo tras ${maxAttempts} intentos: ${ultimoError.message}`
            );
          }

          descargarConReintentos()
            .then(() => {
              console.log("Descarga completada.");
              process.exit(0);
            })
            .catch(error => {
              console.error(error.message);
              process.exit(1);
            });
          JS

      - name: Preparar rama antes del push
        shell: bash
        run: |
          set -euo pipefail

          current_branch="$(git branch --show-current || echo "${GITHUB_REF_NAME:-main}")"
          echo "current_branch=$current_branch" >> "$GITHUB_ENV"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios que confirmar antes del rebase."
          else
            git commit -m "chore: actualizar listas M3U antes de rebase"
          fi

          git pull --rebase origin "$current_branch"

      - name: Commit y push de la lista actualizada
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que confirmar."
            exit 0
          fi

          git commit -m "chore: actualizar hashes AceStream"

          git push origin HEAD:"$current_branch"

name: Actualizar lista M3U

on:
  schedule:
    - cron: '7,37 9-21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-lista-m3u-${{ github.ref }}
  cancel-in-progress: false

jobs:
  descarga_reemplazo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Descargar lista M3U
        shell: bash
        env:
          LIST_URL: "https://ipfs.bytokyo.dpdns.org/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes.m3u"
        run: |
          set -euo pipefail

          OUTPUT_FILE="lista_origen.m3u"
          attempt=0
          max_attempts=3

          while [ "${attempt}" -lt "${max_attempts}" ]; do
            attempt=$((attempt + 1))
            echo "Intento ${attempt}/${max_attempts} para: ${LIST_URL}"

            extra_curl_args=()

            if [ "${attempt}" -eq 2 ]; then
              extra_curl_args+=(--ipv4)
            fi

            if [ "${attempt}" -eq 3 ]; then
              extra_curl_args+=(--http1.1)
            fi

            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 30 \
              --max-time 180 \
              --compressed \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              -H "Accept: */*" \
              -H "Accept-Language: es-ES,es;q=0.9,en;q=0.8" \
              -H "Cache-Control: no-cache" \
              "${extra_curl_args[@]}" \
              --output "${OUTPUT_FILE}" \
              "${LIST_URL}"; then

              if [ -s "${OUTPUT_FILE}" ] && head -c 500 "${OUTPUT_FILE}" \
                | sed '1s/^\xEF\xBB\xBF//' \
                | grep -q '^#EXTM3U'; then
                echo "Descarga correcta: ${OUTPUT_FILE} ($(wc -c < "${OUTPUT_FILE}") bytes)"
                exit 0
              fi

              echo "ERROR: La respuesta no es una lista M3U válida."
              head -c 500 "${OUTPUT_FILE}" || true
            else
              echo "ERROR: curl no pudo completar la descarga."
            fi

            rm -f "${OUTPUT_FILE}"
            sleep 15
          done

          echo "ERROR: No se pudo descargar la lista tras ${max_attempts} intentos."
          exit 1

      - name: Verificar lista descargada
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s lista_origen.m3u ]; then
            echo "ERROR: La lista descargada está vacía."
            exit 1
          fi

          if ! head -c 500 lista_origen.m3u | grep -q '^#EXTM3U'; then
            echo "ERROR: La lista descargada no comienza con #EXTM3U."
            exit 1
          fi

          echo "Canales en la lista: $(grep -c '^#EXTINF' lista_origen.m3u || true)"
          echo "Grupos declarados: $(grep -c '^#EXTGRP' lista_origen.m3u || true)"

      - name: Commit y push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lista_origen.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios que confirmar."
            exit 0
          fi

          git commit -m "Actualizar lista M3U"
          git push

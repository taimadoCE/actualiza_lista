name: Actualizar listas M3U

on:
  schedule:
    - cron: '7,37 9-21 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-listas-m3u-${{ github.ref }}
  cancel-in-progress: false

jobs:
  descarga_reemplazo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Descargar archivo original directamente
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://neweraes.atwebpages.com"
          FILE_URL="${BASE_URL}/lista_iptv.m3u"

          echo "Descargando lista desde: ${FILE_URL}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            --header "Cache-Control: no-cache" \
            --output lista_original.m3u \
            "${FILE_URL}"

          if [ ! -s lista_original.m3u ]; then
            echo "ERROR: El archivo descargado está vacío."
            exit 1
          fi

          # Comprobar que la respuesta realmente es una lista M3U.
          if ! head -c 500 lista_original.m3u \
            | sed '1s/^\xEF\xBB\xBF//' \
            | grep -q '^#EXTM3U'; then

            echo "ERROR: La respuesta no parece una lista M3U válida."
            echo "Primeros bytes recibidos:"
            head -c 500 lista_original.m3u
            exit 1
          fi

          echo "Descarga completada correctamente."
          echo "Tamaño: $(wc -c < lista_original.m3u) bytes"

      - name: Crear variantes de la lista
        shell: bash
        run: |
          set -euo pipefail

          cp lista_original.m3u lista_origen.m3u

          sed \
            's#http://127.0.0.1:6878#https://acexy.taimado.duckdns.org#g' \
            lista_original.m3u > lista_modificada.m3u

          sed \
            's#127.0.0.1:6878#192.168.1.254:6878#g' \
            lista_original.m3u > lista_local.m3u

          sed \
            's#127.0.0.1:6878#100.83.12.86:6878#g' \
            lista_original.m3u > lista_tanix.m3u

          sed \
            's#http://127.0.0.1:6878#https://acexyce.taimado.duckdns.org#g' \
            lista_original.m3u > lista_modificada_ce.m3u

          echo "Creadas las cinco variantes de la lista."

      - name: Verificar si hay cambios
        id: verify_diff
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            lista_origen.m3u \
            lista_modificada.m3u \
            lista_local.m3u \
            lista_tanix.m3u \
            lista_modificada_ce.m3u

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en las listas."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Hay cambios en las listas."
          fi

      - name: Commit y push de las listas
        if: steps.verify_diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config user.name "github-actions[bot]"

          git commit \
            -m "🤖 Lista M3U - $(TZ=Europe/Madrid date +'%Y-%m-%d %H:%M:%S')"

          git push

          PY

          if [ ! -s lista_fusionada.m3u ]; then
            echo "ERROR: No se pudo generar la lista fusionada."
            exit 1
          fi

          echo "Lista fusionada creada correctamente."

      - name: Crear variantes de la lista
        shell: bash
        run: |
          set -euo pipefail

          cp lista_fusionada.m3u lista_origen.m3u

          sed \
            's#http://127.0.0.1:6878#https://acexy.taimado.duckdns.org#g' \
            lista_fusionada.m3u > lista_modificada.m3u

          sed \
            's#127.0.0.1:6878#192.168.1.254:6878#g' \
            lista_fusionada.m3u > lista_local.m3u

          sed \
            's#127.0.0.1:6878#100.83.12.86:6878#g' \
            lista_fusionada.m3u > lista_tanix.m3u

          sed \
            's#http://127.0.0.1:6878#https://acexyce.taimado.duckdns.org#g' \
            lista_fusionada.m3u > lista_modificada_ce.m3u

          echo "Creadas las cinco variantes de la lista."

      - name: Verificar si hay cambios
        id: verify_diff
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            lista_origen.m3u \
            lista_modificada.m3u \
            lista_local.m3u \
            lista_tanix.m3u \
            lista_modificada_ce.m3u

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en las listas."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Hay cambios en las listas."
          fi

      - name: Commit y push de las listas
        if: steps.verify_diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git commit \
            -m "🤖 Lista M3U - $(TZ=Europe/Madrid date +'%Y-%m-%d %H:%M:%S')"

          git push

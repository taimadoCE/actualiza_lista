name: Actualizar listas M3U

on:
  schedule:
    - cron: '7,37 9-21 * * *'→ Runs at 7 and 37 minutes past the hour, between 09:00 and 21:59
      timezone: 'Europe/Madrid'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-listas-m3u-${{ github.ref }}
  cancel-in-progress: false

jobs:
  descarga_reemplazo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Descargar archivo original directamente
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://neweraes.atwebpages.com"
          FILE_URL="${BASE_URL}/lista_iptv.m3u"

          echo "Descargando lista desde: ${FILE_URL}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            --header "Cache-Control: no-cache" \
            --output lista_original.m3u \
            "${FILE_URL}"

          if [ ! -s lista_original.m3u ]; then
            echo "ERROR: El archivo descargado está vacío."
            exit 1
          fi

          # Comprobar que la respuesta realmente es una lista M3U.
          if ! head -c 500 lista_original.m3u \
            | sed '1s/^\xEF\xBB\xBF//' \
            | grep -q '^#EXTM3U'; then

            echo "ERROR: La respuesta no parece una lista M3U válida."
            echo "Primeros bytes recibidos:"
            head -c 500 lista_original.m3u
            exit 1
          fi

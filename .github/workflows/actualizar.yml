name: Actualizar listas M3U

on:
  schedule:
    - cron: "7,37 9-21 * * *"
      # GitHub Actions usa UTC; `timezone` no forma parte de la configuración estándar.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-listas-m3u-${{ github.ref }}
  cancel-in-progress: false

jobs:
  descarga_reemplazo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Descargar las dos listas
        shell: bash
        run: |
          set -euo pipefail

          URL_PRIMERA="http://neweraes.atwebpages.com/lista_iptv.m3u"
          URL_SEGUNDA="https://ipfs.bytokyo.dpdns.org/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes.m3u"

          descargar_y_validar() {
            local nombre="$1"
            local url="$2"
            local archivo="lista_${nombre}.m3u"

            echo "Descargando lista ${nombre}: ${url}"

            if ! curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --user-agent "Mozilla/5.0" \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 180 \
              --header "Cache-Control: no-cache" \
              --output "${archivo}" \
              "${url}"; then
              echo "ERROR: No se pudo descargar la lista ${nombre}."
              echo "El servidor puede estar rechazando la solicitud o la URL puede no estar disponible."
              exit 1
            fi

            if [ ! -s "${archivo}" ]; then
              echo "ERROR: ${archivo} está vacío."
              exit 1
            fi

            if ! head -c 500 "${archivo}" \
              | sed '1s/^\xEF\xBB\xBF//' \
              | grep -q '^#EXTM3U'; then
              echo "ERROR: ${archivo} no parece una lista M3U válida."
              echo "Primeros bytes recibidos:"
              head -c 500 "${archivo}"
              exit 1
            fi

            echo "Descargada y validada: ${archivo} ($(wc -c < "${archivo}") bytes)"
          }

          descargar_y_validar "primera" "${URL_PRIMERA}"
          descargar_y_validar "segunda" "${URL_SEGUNDA}"

      - name: Fusionar listas por categoría y eliminar duplicados
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re

          def leer_lista(ruta):
              texto = Path(ruta).read_text(
                  encoding="utf-8-sig",
                  errors="replace",
              )

              entradas = []
              bloque = []

              for linea in texto.splitlines():
                  linea = linea.strip()

                  if not linea or linea == "#EXTM3U":
                      continue

                  if linea.startswith("#EXTINF:"):
                      if bloque:
                          entradas.append(bloque)
                      bloque = [linea]
                  elif bloque:
                      bloque.append(linea)

                      # La entrada termina al encontrar la URL.
                      # Se conservan líneas intermedias como #EXTVLCOPT.
                      if not linea.startswith("#"):
                          entradas.append(bloque)
                          bloque = []

              if bloque:
                  entradas.append(bloque)

              return entradas

          grupos = defaultdict(list)
          urls_vistas = set()
          duplicados = 0

          # Se procesa primero la lista principal.
          # Si una URL aparece en ambas, se conserva la entrada de la primera.
          for archivo in ("lista_primera.m3u", "lista_segunda.m3u"):
              for entrada in leer_lista(archivo):
                  url = next(
                      (
                          linea
                          for linea in entrada
                          if not linea.startswith("#")
                      ),
                      None,
                  )

                  if not url:
                      continue

                  if url in urls_vistas:
                      duplicados += 1
                      continue

                  urls_vistas.add(url)

                  info = next(
                      (
                          linea
                          for linea in entrada
                          if linea.startswith("#EXTINF:")
                      ),
                      "",
                  )
                  coincidencia = re.search(r'group-title="([^"]*)"', info)

                  categoria = (
                      coincidencia.group(1).strip()
                      if coincidencia and coincidencia.group(1).strip()
                      else "Sin categoría"
                  )

                  grupos[categoria].append(entrada)

          if not grupos:
              raise SystemExit(
                  "ERROR: No se encontraron entradas M3U para fusionar."
              )

          with open(
              "lista_original.m3u",
              "w",
              encoding="utf-8",
              newline="\n",
          ) as salida:
              salida.write("#EXTM3U\n")

              for categoria in sorted(grupos, key=str.casefold):
                  for entrada in grupos[categoria]:
                      salida.write("\n".join(entrada) + "\n")

          print(f"Categorías: {len(grupos)}")
          print(f"Canales únicos: {len(urls_vistas)}")
          print(f"Duplicados eliminados: {duplicados}")
          PY

          if [ ! -s lista_original.m3u ]; then
            echo "ERROR: La lista fusionada está vacía."
            exit 1
          fi

          echo "Lista fusionada: $(wc -c < lista_original.m3u) bytes"

      - name: Crear variantes de la lista
        shell: bash
        run: |
          set -euo pipefail

          cp lista_original.m3u lista_origen.m3u

          sed \
            's#http://127.0.0.1:6878#https://acexy.taimado.duckdns.org#g' \
            lista_original.m3u > lista_modificada.m3u

          sed \
            's#127.0.0.1:6878#192.168.1.254:6878#g' \
            lista_original.m3u > lista_local.m3u

          sed \
            's#127.0.0.1:6878#100.83.12.86:6878#g' \
            lista_original.m3u > lista_tanix.m3u

          sed \
            's#http://127.0.0.1:6878#https://acexyce.taimado.duckdns.org#g' \
            lista_original.m3u > lista_modificada_ce.m3u

          echo "Creadas las cinco variantes de la lista."

      - name: Verificar si hay cambios
        id: verify_diff
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            lista_origen.m3u \
            lista_modificada.m3u \
            lista_local.m3u \
            lista_tanix.m3u \
            lista_modificada_ce.m3u

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en las listas."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Hay cambios en las listas."
          fi

      - name: Commit y push de las listas
        if: steps.verify_diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git commit \
            -m "🤖 Lista M3U - $(TZ=Europe/Madrid date +'%Y-%m-%d %H:%M:%S')"

          git push

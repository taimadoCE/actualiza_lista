name: Actualizar listas M3U

on:
  schedule:
    # A los minutos 07 y 37, cada hora de 09:00 a 21:59 (hora de Madrid).
    - cron: '7,37 9-21 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-listas-m3u-${{ github.ref }}
  cancel-in-progress: false

jobs:
  descarga_reemplazo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Descargar y validar lista M3U
        shell: bash
        run: |
          set -euo pipefail

          FILE_URL="http://neweraes.atwebpages.com/lista_iptv.m3u"
          OUTPUT_FILE="lista_original.m3u"
          TEMP_FILE="${RUNNER_TEMP}/lista_original.m3u"

          echo "Descargando lista desde: ${FILE_URL}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            --header "Cache-Control: no-cache" \
            --output "${TEMP_FILE}" \
            "${FILE_URL}"

          if [ ! -s "${TEMP_FILE}" ]; then
            echo "ERROR: El archivo descargado está vacío."
            exit 1
          fi

          # Acepta un posible BOM UTF-8 al principio del archivo.
          if ! python3 - "${TEMP_FILE}" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          with path.open("rb") as file:
              first_line = file.readline().lstrip(b"\xef\xbb\xbf").strip()

          if first_line != b"#EXTM3U":
              print("ERROR: La respuesta no parece una lista M3U válida.")
              print(f"Primera línea recibida: {first_line[:200]!r}")
              sys.exit(1)
          PY
          then
            echo "Primeros bytes recibidos:"
            head -c 500 "${TEMP_FILE}" || true
            exit 1
          fi

          cp "${TEMP_FILE}" "${OUTPUT_FILE}"
          echo "Lista validada y guardada como ${OUTPUT_FILE}."

      - name: Guardar cambios en el repositorio
        shell: bash
        run: |
          set -euo pipefail

          git add -- lista_original.m3u

          if git diff --cached --quiet; then
            echo "La lista no ha cambiado; no hay nada que guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Actualizar lista M3U"
          git push

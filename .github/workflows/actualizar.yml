name: Actualizar listas M3U

on:
  schedule:
    - cron: "7,37 9-21 * * *"→ Runs at 7 and 37 minutes past the hour, between 09:00 and 21:59
      # GitHub Actions usa UTC; `timezone` no forma parte de la configuración estándar.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-listas-m3u-${{ github.ref }}
  cancel-in-progress: false

jobs:
  descarga_reemplazo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Descargar las dos listas
        shell: bash
        run: |
          set -euo pipefail

          URL_PRIMERA="http://neweraes.atwebpages.com/lista_iptv.m3u"
          ARCHIVO_PRIMERA="lista_primera.m3u"
          ARCHIVO_SEGUNDA="lista_segunda.m3u"

          validar_m3u() {
            python3 -c '
          import sys
          from pathlib import Path

          contenido = Path(sys.argv[1]).read_bytes()[:500]
          contenido = contenido.removeprefix(b"\xef\xbb\xbf")
          if not contenido.lstrip().startswith(b"#EXTM3U"):
              sys.exit(1)
          ' "$1"
          }


name: Actualizar

on:
  schedule:
    - cron: '1,31 * * * *'  # Minutos 1 y 31 de cada hora, en UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descarga_reemplazo:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Ejecutar solo de 09:05 a 21:59
        shell: bash
        run: |
          set -euo pipefail

          HOUR=$(TZ='Europe/Madrid' date +'%H')
          MINUTE=$(TZ='Europe/Madrid' date +'%M')

          if [ "$HOUR" -lt 9 ] || [ "$HOUR" -gt 21 ]; then
            echo "Fuera de horario Europe/Madrid: ${HOUR}:${MINUTE}. Saliendo sin hacer nada."
            exit 0
          fi

          echo "Dentro de horario Europe/Madrid: ${HOUR}:${MINUTE}. Continúo..."

      - name: Instalar curl_cffi
        shell: bash
        run: |
          python3 -m pip install --upgrade --disable-pip-version-check curl_cffi

      - name: Descargar archivo original simulando Chrome
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from curl_cffi import requests

          url = (
              "https://k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb"
              ".ipns.inbrowser.link/data/listas/lista_iptv.m3u"
          )

          print(f"Descargando: {url}")

          response = requests.get(
              url,
              impersonate="chrome",
              allow_redirects=True,
              timeout=180,
              headers={
                  "Accept": "*/*",
                  "Accept-Language": "es-ES,es;q=0.9,en;q=0.8",
              },
          )

          print(f"HTTP final: {response.status_code}")
          print(f"URL final: {response.url}")

          response.raise_for_status()

          content = response.content

          if not content.strip():
              raise RuntimeError("El archivo descargado está vacío")

          with open("lista_original.m3u", "wb") as output:
              output.write(content)

          print(f"Archivo descargado correctamente: {len(content)} bytes")
          PY

          if [ ! -s lista_original.m3u ]; then
            echo "Error: el archivo descargado está vacío"
            exit 1
          fi

      - name: Validar lista descargada
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q '^#EXTM3U' lista_original.m3u; then
            echo "Error: el archivo no parece una lista M3U válida"
            echo "Primeras líneas recibidas:"
            head -n 10 lista_original.m3u
            exit 1
          fi

          echo "✅ Lista M3U válida"

      - name: Lista origen
        shell: bash
        run: |
          set -euo pipefail

          sed 's/127.0.0.1:6878/127.0.0.1:6878/g' \
            lista_original.m3u > lista_origen.m3u

          echo "✅ Lista origen creada: lista_origen.m3u (127.0.0.1:6878)"

      - name: Crear primera versión modificada
        shell: bash
        run: |
          set -euo pipefail

          sed 's#http://127.0.0.1:6878#https://acexy.taimado.duckdns.org#g' \
            lista_original.m3u > lista_modificada.m3u

          echo "✅ Primera versión creada: lista_modificada.m3u (acexy.taimado.duckdns.org)"

      - name: Crear segunda versión modificada
        shell: bash
        run: |
          set -euo pipefail

          sed 's/127.0.0.1:6878/192.168.1.254:6878/g' \

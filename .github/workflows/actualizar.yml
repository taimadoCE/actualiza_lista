name: Actualizar listas M3U

on:
  schedule:
    - cron: '7,37 9-21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-listas-m3u-${{ github.ref }}
  cancel-in-progress: false

jobs:
  descarga_reemplazo:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Playwright y Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Descargar y actualizar listas M3U
        shell: bash
        env:
          LISTA_HASHES_ACESTREAM: https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u
        run: |
          set -euo pipefail
          node <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");
          const path = require("path");

          const listas = [
            {
              nombre: "hashes_acestream",
              url: process.env.LISTA_HASHES_ACESTREAM,
              archivo: "data/listas/hashes_acestream.m3u"
            }
          ];

          const maxAttempts = 4;

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          function validarBody(body) {
            if (!body || !body.length) {
              throw new Error("El archivo descargado está vacío");
            }

            const normalizedStart = body
              .toString("utf8")
              .replace(/^\uFEFF/, "")
              .trimStart();

            if (!normalizedStart.startsWith("#EXTM3U")) {
              throw new Error(
                "El archivo descargado no comienza por #EXTM3U"
              );
            }
          }

          async function descargarLista(browser, lista) {
            let ultimoError = null;

            for (let intento = 1; intento <= maxAttempts; intento++) {
              try {
                console.log(
                  `Descargando ${lista.nombre}: intento ${intento} de ${maxAttempts}`
                );

                const context = await browser.newContext();
                const page = await context.newPage();

                const response = await page.goto(lista.url, {
                  waitUntil: "domcontentloaded",
                  timeout: 60000
                });

                if (!response || !response.ok()) {
                  throw new Error(
                    `La descarga devolvió el estado ${
                      response ? response.status() : "desconocido"
                    }`
                  );
                }

                const body = await response.body();
                validarBody(body);

                const rutaSalida = path.resolve(lista.archivo);
                fs.mkdirSync(path.dirname(rutaSalida), { recursive: true });
                fs.writeFileSync(rutaSalida, body);

                await context.close();

                console.log(
                  `Lista ${lista.nombre} guardada en ${lista.archivo}`
                );
                return;
              } catch (error) {
                ultimoError = error;

                console.error(
                  `Error descargando ${lista.nombre}, intento ${intento}: ${error.message}`
                );

                if (intento < maxAttempts) {
                  const espera = intento * 15000;
                  console.log(`Esperando ${espera / 1000} segundos...`);
                  await sleep(espera);
                }
              }
            }

            throw new Error(
              `No se pudo descargar ${lista.nombre} tras ${maxAttempts} intentos: ${ultimoError.message}`
            );
          }

          async function main() {
            const browser = await chromium.launch({
              headless: true
            });

            try {
              for (const lista of listas) {
                await descargarLista(browser, lista);
              }
            } finally {
              await browser.close();
            }
          }

          main()
            .then(() => {
              console.log("Todas las listas se han descargado correctamente.");
              process.exit(0);
            })
            .catch(error => {
              console.error(error.message);
              process.exit(1);
            });
          JS

      - name: Preparar rama antes del push
        shell: bash
        run: |
          set -euo pipefail

          current_branch="$(git branch --show-current || echo "${GITHUB_REF_NAME:-main}")"
          echo "current_branch=$current_branch" >> "$GITHUB_ENV"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios que confirmar antes del rebase."
          else
            git commit -m "chore: actualizar listas M3U antes de rebase"
          fi

          git pull --rebase origin "$current_branch"

      - name: Commit y push de las listas actualizadas
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que confirmar."
            exit 0
          fi

          git commit -m "chore: actualizar listas M3U"

          git push origin HEAD:"$current_branch"
